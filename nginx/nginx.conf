events {}

http {
    upstream auth_ms {
        server authentication-ms:8080;
    }

    upstream appointment_ms {
        server appointment-ms:8081;
    }

    server {
        listen 80;

        location /api/auth/ {
            proxy_pass http://auth_ms;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/appointments/ {
            proxy_pass http://appointment_ms;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check for the gateway
        location /health {
            return 200 'Gateway is up';
        }
    }
}
